<!DOCTYPE html>
<html>
<head>
  <title>Descomprimir ZIP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <input type="file" id="zipFile" accept=".zip">
  <button onclick="unzipFile()">Descomprimir</button>
  <pre id="output"></pre>

  <script>
    async function unzipFile() {
      const input = document.getElementById('zipFile');
      const output = document.getElementById('output');
      if (!input.files[0]) {
        output.textContent = 'Por favor, selecciona un archivo ZIP.';
        return;
      }

      const zipFile = input.files[0];
      const zip = new JSZip();

      try {
        // Leer el archivo ZIP
        const content = await zip.loadAsync(zipFile);
        
        // Iterar sobre los archivos dentro del ZIP
        for (let filename in content.files) {
          const file = content.files[filename];
          if (!file.dir) { // Solo procesar archivos, no directorios
            const fileContent = await file.async('string'); // O 'arraybuffer', 'blob', etc.
            output.textContent += `Archivo: ${filename}\nContenido: ${fileContent}\n\n`;
            //debugger
          }
        }
      } catch (error) {
        output.textContent = 'Error al descomprimir: ' + error.message;
      }
    }
  </script>
</body>
</html>
