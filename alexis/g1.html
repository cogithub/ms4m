<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descompresor Gzip a Tabla con Duración</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        pre {
            color: red;
        }
        .filter-container {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Descompresor de Archivo Gzip a Tabla</h1>
    <input type="text" id="urlInput" placeholder="Ingresa la URL del archivo .gz" style="width: 600px;">
    <div class="filter-container">
        <label for="yearFilter">Año:</label>
        <select id="yearFilter" onchange="fetchAndDecompress()">
            <option value="">Todos</option>
            <!-- Años generados dinámicamente -->
        </select>
        <label for="monthFilter">Mes:</label>
        <select id="monthFilter" onchange="fetchAndDecompress()">
            <option value="">Todos</option>
            <option value="01">Enero</option>
            <option value="02">Febrero</option>
            <option value="03">Marzo</option>
            <option value="04">Abril</option>
            <option value="05">Mayo</option>
            <option value="06">Junio</option>
            <option value="07">Julio</option>
            <option value="08">Agosto</option>
            <option value="09">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
        </select>
    </div>
    <button onclick="fetchAndDecompress()">Obtener y Descomprimir</button>
    <div id="output"></div>

    <script>
        var duracion1 = 0;
        var duracion2 = 0;
        var duracion3 = 0;
        var duracion4 = 0;
        var duracion5 = 0;

        // Generar opciones de años dinámicamente (por ejemplo, desde 2000 hasta el año actual)
        function populateYearFilter() {
            const yearSelect = document.getElementById('yearFilter');
            const currentYear = new Date().getFullYear();
            for (let year = currentYear; year >= 2000; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.text = year;
                yearSelect.appendChild(option);
            }
        }

        // Llamar a la función para poblar los años al cargar la página
        window.onload = populateYearFilter;

        function parseData(text) {
            const yearFilter = document.getElementById('yearFilter').value;
            const monthFilter = document.getElementById('monthFilter').value;
            const lines = text.trim().split('\n');
            const result = [];
            let headersAdded = false;

            lines.forEach((line, index) => {
                const cells = line.split(';').map(cell => cell.trim());

                // Asumimos que la fecha está en cells[0] con formato YYYY-MM-DD
                const date = cells[0] || '';
                const [year, month] = date.split('-');

                // Filtrar por año y mes
                const matchesYear = !yearFilter || (year && year === yearFilter);
                const matchesMonth = !monthFilter || (month && month === monthFilter);

                if (index === 0) {
                    // Añadir encabezados
                    result.push(cells);
                    headersAdded = true;
                } else if (matchesYear && matchesMonth) {
                    // Procesar filas de datos que coincidan con los filtros
                    if (cells[2] == 1) {
                        duracion1 += parseFloat(cells[10]) || 0;
                        console.log("se suma1: " + cells[2] + "->" + duracion1);
                        alert("duracion1: -"+duracion1);
                    }
                    if (cells[2] == 2) {
                        duracion2 += parseFloat(cells[10]) || 0;
                        console.log("se suma2: " + cells[2] + "->" + duracion2);
                         alert("duracion2: -"+duracion2);
                    }
                    if (cells[2] == 3) {
                        duracion3 += parseFloat(cells[10]) || 0;
                        console.log("se suma3: " + cells[2] + "->" + duracion3);
                         alert("duracion3: -"+duracion3);
                    }
                    if (cells[2] == 4) {
                        duracion4 += parseFloat(cells[10]) || 0;
                        console.log("se suma4: " + cells[2] + "->" + duracion4);
                         alert("duracion4: -"+duracion4);
                    }
                    if (cells[2] == 5) {
                        duracion5 += parseFloat(cells[10]) || 0;
                        console.log("se suma5: " + cells[2] + "->" + duracion5);
                            alert("duracion5: -"+duracion5); 
                    }
                    result.push(cells);
                }
            });

            return result;
        }

        function createTable(data) {
            if (!data || data.length <= 1) return '<p>No hay datos para mostrar.</p>';

            let html = '<table>';
            // Encabezados
            html += '<tr>';
            data[0].forEach(header => {
                html += `<th>${header}</th>`;
            });
            html += '</tr>';
            // Filas de datos
            for (let i = 1; i < data.length; i++) {
                html += '<tr>';
                data[i].forEach(cell => {
                    html += `<td>${cell}</td>`;
                });
                html += '</tr>';
            }
            html += '</table>';
            return html;
        }

        async function fetchAndDecompress() {
            const url = document.getElementById('urlInput').value;
            const outputElement = document.getElementById('output');

            try {
                // Obtener el archivo .gz
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                // Convertir la respuesta a un ArrayBuffer
                const arrayBuffer = await response.arrayBuffer();

                // Descomprimir el contenido usando pako
                const decompressed = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });

                // Parsear el contenido con el delimitador ";" y aplicar filtros
                try {
                    const parsedData = parseData(decompressed);
                    const tableHtml = createTable(parsedData);
                    outputElement.innerHTML = tableHtml;
                } catch (parseError) {
                    outputElement.innerHTML = `<pre>Error al parsear el contenido: ${parseError.message}</pre>`;
                }
            } catch (error) {
                outputElement.innerHTML = `<pre>Error: ${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
