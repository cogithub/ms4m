<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Total Transcurrido en Hrs./Status</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .filter-container {
            margin: 20px auto;
            text-align: center;
        }
        .filter-section {
            margin: 10px 0;
        }
        .filter-section label {
            margin-right: 10px;
        }
        .filter-section input[type="date"] {
            padding: 5px;
            font-size: 16px;
        }
        #chartContainer {
            width: 80%;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>Total Transcurrido Hrs./Status</h1>
    <div class="filter-container">
        <div class="filter-section">
            <h3>Fecha Desde</h3>
            <label for="fromDate">Fecha:</label>
            <input type="date" id="fromDate" value="2023-01-01">
        </div>
        <div class="filter-section">
            <h3>Fecha Hasta</h3>
            <label for="toDate">Fecha:</label>
            <input type="date" id="toDate" value="2025-08-30">
        </div>
        <button onclick="fetchAndDecompress()">Obtener y Descomprimir</button>
    </div>
    <div id="output"></div>

    <table border="1">
        <thead>
            <tr>
                <th>ID Status main</th>
                <th>Status main</th>
                <th>Transcurrido Hr.</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>READY</td>
                <td id="duracion1">0.00</td>
            </tr>
            <tr>
                <td>2</td>
                <td>DELAY</td>
                <td id="duracion2">0.00</td>
            </tr>
            <tr>
                <td>3</td>
                <td>STANDBY</td>
                <td id="duracion3">0.00</td>
            </tr>
            <tr>
                <td>4</td>
                <td>MAINT</td>
                <td id="duracion4">0.00</td>
            </tr>
            <tr>
                <td>5</td>
                <td>OUTOFPLAN</td>
                <td id="duracion5">0.00</td>
            </tr>
        </tbody>
    </table>

    <div id="chartContainer">
        <canvas id="statusChart"></canvas>
    </div>

    <script>
        var duracion1 = 0;
        var duracion2 = 0;
        var duracion3 = 0;
        var duracion4 = 0;
        var duracion5 = 0;

        // Configuración inicial del gráfico
        const ctx = document.getElementById('statusChart').getContext('2d');
        const statusChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['READY', 'DELAY', 'STANDBY', 'MAINT', 'OUTOFPLAN'],
                datasets: [{
                    label: 'Horas Transcurridas',
                    data: [duracion1, duracion2, duracion3, duracion4, duracion5],
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Horas Transcurridas'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Estado'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Total de Horas Transcurridas por Estado (2023-01-01 a 2025-08-30)'
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        formatter: (value) => `${value.toFixed(2)} hrs`,
                        color: '#000',
                        font: {
                            weight: 'bold',
                            size: 12
                        },
                        backgroundColor: 'rgba(255, 255, 255, 0.7)',
                        borderRadius: 3,
                        padding: 4
                    }
                }
            },
            plugins: [ChartDataLabels]
        });

        function formatearFecha(fecha) {
            const year = fecha.getFullYear();
            const month = String(fecha.getMonth() + 1).padStart(2, '0');
            const day = String(fecha.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function fetchAndDecompress() {
            const outputElement = document.getElementById('output');
            const fromDateInput = document.getElementById('fromDate').value;
            const toDateInput = document.getElementById('toDate').value;

            // Validate date range
            const fromDate = new Date(fromDateInput);
            const toDate = new Date(toDateInput);
            if (toDate < fromDate) {
                outputElement.innerHTML = '<p>Error: La fecha "Hasta" debe ser mayor o igual a la fecha "Desde".</p>';
                return;
            }

            // Reset duration values
            duracion1 = 0;
            duracion2 = 0;
            duracion3 = 0;
            duracion4 = 0;
            duracion5 = 0;

            // Update table with reset values
            document.getElementById('duracion1').textContent = '0.00';
            document.getElementById('duracion2').textContent = '0.00';
            document.getElementById('duracion3').textContent = '0.00';
            document.getElementById('duracion4').textContent = '0.00';
            document.getElementById('duracion5').textContent = '0.00';

            outputElement.innerHTML = '<p>Cargando...</p>';
            const componentes = fromDateInput.split("-");
            const año = componentes[0];
            const mes = componentes[1];
            const fechaFormateada = `${año}/${mes}`;
            try {
                // Construct the URL with the full date range
                const response = await fetch(`http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=${fechaFormateada}/&f=statushistory`);

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                // Get the response as ArrayBuffer
                const arrayBuffer = await response.arrayBuffer();

                // Decompress the content using pako
                const decompressed = pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });

                // Split the content into lines
                const lines = decompressed.split('\n').filter(line => line.trim() !== '');

                // Process the data
                if (lines.length > 0) {
                    for (let i = 1; i < lines.length; i++) {
                        const columns = lines[i].split(';').map(col => col.trim());

                        // Ensure the date falls within the selected range
                        const recordDate = columns[0];
                        if (recordDate) {
                            const [recordYear, recordMonth, recordDay] = recordDate.split('-').map(Number);
                            const feccubo = new Date(columns[9]);
                            const feccubo2 = new Date(columns[9]);

                            let fec1 = new Date(fromDateInput);
                            let fec2 = new Date(toDateInput);

                            let a = formatearFecha(fec1);
                            let b = formatearFecha(feccubo2);
                            let c = formatearFecha(fec2);

                            if (a <= b && b <= c) {
                                if (columns[2] == 1) {
                                    duracion1 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion1').textContent = duracion1.toFixed(2);
                                }
                                if (columns[2] == 2) {
                                    duracion2 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion2').textContent = duracion2.toFixed(2);
                                }
                                if (columns[2] == 3) {
                                    duracion3 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion3').textContent = duracion3.toFixed(2);
                                }
                                if (columns[2] == 4) {
                                    duracion4 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion4').textContent = duracion4.toFixed(2);
                                }
                                if (columns[2] == 5) {
                                    duracion5 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion5').textContent = duracion5.toFixed(2);
                                }
                            }
                        }
                    }
                    // Actualizar el gráfico con los nuevos valores
                    statusChart.data.datasets[0].data = [duracion1, duracion2, duracion3, duracion4, duracion5];
                    statusChart.update();
                } else {
                    outputElement.innerHTML = '<p>No hay datos para mostrar</p>';
                }

                // Clear the loading message
                outputElement.innerHTML = '';

            } catch (error) {
                outputElement.innerHTML = `<p>Error: ${escapeHTML(error.message)}</p>`;
            }
        }

        // Function to escape HTML characters to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }
    </script>
</body>
</html>
