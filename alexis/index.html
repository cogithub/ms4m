<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Total Transcurrido en Hrs./Status</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .filter-container {
            margin: 20px auto;
            text-align: center;
        }
        .filter-container select {
            margin: 0 10px;
        }
        .filter-section {
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>Total Transcurrido Hrs./Status</h1>
    <div class="filter-container">
        <div class="filter-section">
            <h3>Fecha Desde</h3>
            <label for="fromYear">Año:</label>
            <select id="fromYear" onchange="updateFromDayOptions()">
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
               
            </select>
            <label for="fromMonth">Mes:</label>
            <select id="fromMonth" onchange="updateFromDayOptions()">
                <option value="01">Enero</option>
                <option value="02">Febrero</option>
                <option value="03">Marzo</option>
                <option value="04">Abril</option>
                <option value="05">Mayo</option>
                <option value="06">Junio</option>
                <option value="07">Julio</option>
                <option value="08">Agosto</option>
                <option value="09">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
            <label for="fromDay">Día:</label>
            <select id="fromDay"></select>
        </div>
        <div class="filter-section">
            <h3>Fecha Hasta</h3>
            <label for="toYear">Año:</label>
            <select id="toYear" onchange="updateToDayOptions()">
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
            </select>
            <label for="toMonth">Mes:</label>
            <select id="toMonth" onchange="updateToDayOptions()">
                <option value="01">Enero</option>
                <option value="02">Febrero</option>
                <option value="03">Marzo</option>
                <option value="04">Abril</option>
                <option value="05">Mayo</option>
                <option value="06">Junio</option>
                <option value="07">Julio</option>
                <option value="08">Agosto</option>
                <option value="09">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
            <label for="toDay">Día:</label>
            <select id="toDay"></select>
        </div>
        <button onclick="fetchAndDecompress()">Obtener y Descomprimir</button>
    </div>
    <div id="output"></div>

    <table border="1">
        <thead>
            <tr>
                <th>ID Status main</th>
                <th>Status main</th>
                <th>Transcurrido Hr.</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>READY</td>
                <td id="duracion1">0.00</td>
            </tr>
            <tr>
                <td>2</td>
                <td>DELAY</td>
                <td id="duracion2">0.00</td>
            </tr>
            <tr>
                <td>3</td>
                <td>STANDBY</td>
                <td id="duracion3">0.00</td>
            </tr>
            <tr>
                <td>4</td>
                <td>MAINT</td>
                <td id="duracion4">0.00</td>
            </tr>
            <tr>
                <td>5</td>
                <td>OUTOFPLAN</td>
                <td id="duracion5">0.00</td>
            </tr>
        </tbody>
    </table>

    <script>
        var duracion1 = 0;
        var duracion2 = 0;
        var duracion3 = 0;
        var duracion4 = 0;
        var duracion5 = 0;

        // Function to update day options for "from" date
        function updateFromDayOptions() {
            const year = document.getElementById('fromYear').value;
            const month = document.getElementById('fromMonth').value;
            const fromDaySelect = document.getElementById('fromDay');
            const daysInMonth = new Date(year, month, 0).getDate();

            fromDaySelect.innerHTML = '';
            for (let i = 1; i <= daysInMonth; i++) {
                const day = i.toString().padStart(2, '0');
                fromDaySelect.innerHTML += `<option value="${day}">${day}</option>`;
            }
            fromDaySelect.value = '01';
        }

        // Function to update day options for "to" date
        function updateToDayOptions() {
            const year = document.getElementById('toYear').value;
            const month = document.getElementById('toMonth').value;
            const toDaySelect = document.getElementById('toDay');
            const daysInMonth = new Date(year, month, 0).getDate();

            toDaySelect.innerHTML = '';
            for (let i = 1; i <= daysInMonth; i++) {
                const day = i.toString().padStart(2, '0');
                toDaySelect.innerHTML += `<option value="${day}">${day}</option>`;
            }
            toDaySelect.value = daysInMonth.toString().padStart(2, '0');
        }

        // Initialize day options on page load
        window.onload = function() {
            updateFromDayOptions();
            updateToDayOptions();
            // Set default "to" date to current date (August 30, 2025)
            document.getElementById('toYear').value = '2025';
            document.getElementById('toMonth').value = '08';
            document.getElementById('toDay').value = '30';
        };

        async function fetchAndDecompress() {
            const outputElement = document.getElementById('output');
            const fromYear = document.getElementById('fromYear').value;
            const fromMonth = document.getElementById('fromMonth').value;
            const fromDay = document.getElementById('fromDay').value;
            const toYear = document.getElementById('toYear').value;
            const toMonth = document.getElementById('toMonth').value;
            const toDay = document.getElementById('toDay').value;

            // Validate date range
            const fromDate = new Date(fromYear, fromMonth - 1, fromDay);
            const toDate = new Date(toYear, toMonth - 1, toDay);
            if (toDate < fromDate) {
                outputElement.innerHTML = '<p>Error: La fecha "Hasta" debe ser mayor o igual a la fecha "Desde".</p>';
                return;
            }

            // Reset duration values
            duracion1 = 0;
            duracion2 = 0;
            duracion3 = 0;
            duracion4 = 0;
            duracion5 = 0;

            // Update table with reset values
            document.getElementById('duracion1').textContent = '0.00';
            document.getElementById('duracion2').textContent = '0.00';
            document.getElementById('duracion3').textContent = '0.00';
            document.getElementById('duracion4').textContent = '0.00';
            document.getElementById('duracion5').textContent = '0.00';

            outputElement.innerHTML = '<p>Cargando...</p>';

            try {
                // Construct the URL with the full date range
                const response = await fetch(`http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=${fromYear}/&f=statushistory`);

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                // Get the response as ArrayBuffer
                const arrayBuffer = await response.arrayBuffer();

                // Decompress the content using pako
                const decompressed = pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });

                // Split the content into lines
                const lines = decompressed.split('\n').filter(line => line.trim() !== '');

                // Process the data
                if (lines.length > 0) {
                    for (let i = 1; i < lines.length; i++) {
                        const columns = lines[i].split(';').map(col => col.trim());

                        // Ensure the date falls within the selected range
                        const recordDate = columns[0]; // Assuming date is in first column (YYYY-MM-DD)
                       
                        if (recordDate) {
                    //    alert("entro")

                            const [recordYear, recordMonth, recordDay] = recordDate.split('-').map(Number);
                            // const currentDate = new Date(recordYear, recordMonth - 1, recordDay);
                            const feccubo = new Date(columns[9]); 
debugger
                            let fec1=new Date(fromYear, fromMonth, fromDay);
                            let fec2=new Date(toYear, toMonth, toDay);

                            if (feccubo >= fec1 && feccubo <= fec2) {
                    //    alert("entro2")

                                if (columns[2] == 1) {
                                    duracion1 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion1').textContent = duracion1.toFixed(2);
                                    console.log(`Suma READY: ${columns[2]} -> ${duracion1}`);
                                }
                                if (columns[2] == 2) {
                                    duracion2 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion2').textContent = duracion2.toFixed(2);
                                    console.log(`Suma DELAY: ${columns[2]} -> ${duracion2}`);
                                }
                                if (columns[2] == 3) {
                                    duracion3 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion3').textContent = duracion3.toFixed(2);
                                    console.log(`Suma STANDBY: ${columns[2]} -> ${duracion3}`);
                                }
                                if (columns[2] == 4) {
                                    duracion4 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion4').textContent = duracion4.toFixed(2);
                                    console.log(`Suma MAINT: ${columns[2]} -> ${duracion4}`);
                                }
                                if (columns[2] == 5) {
                                    duracion5 += parseFloat(columns[10]) || 0;
                                    document.getElementById('duracion5').textContent = duracion5.toFixed(2);
                                    console.log(`Suma OUTOFPLAN: ${columns[2]} -> ${duracion5}`);
                                }
                            }
                        }
                    }
                } else {
                    outputElement.innerHTML = '<p>No hay datos para mostrar</p>';
                }

                // Clear the loading message
                outputElement.innerHTML = '';

            } catch (error) {
                outputElement.innerHTML = `<p>Error: ${escapeHTML(error.message)}</p>`;
            }
        }

        // Function to escape HTML characters to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }
    </script>
</body>
</html>
