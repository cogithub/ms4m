<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read CSV with Date Filter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .filter-container {
            margin-bottom: 20px;
        }
        label {
            margin: 0 10px;
        }
        input[type="date"], input[type="file"] {
            padding: 5px;
            margin: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Read CSV File with Date Filter</h1>
    <div class="filter-container">
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" required>
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" required>
        <button onclick="fetchCSV()">Fetch CSV from Service</button>
    </div>
    <div class="filter-container">
        <label for="csvFile">Upload Local CSV:</label>
        <input type="file" id="csvFile" accept=".csv" onchange="readLocalCSV()">
    </div>
    <div id="status"></div>
    <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        async function fetchCSV() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const statusDiv = document.getElementById('status');

            // Validate dates
            //if (!startDate || !endDate) {
            if (!startDate ) {
                statusDiv.innerHTML = '<p class="error">Please select both start and end dates.</p>';
                return;
            }
            if (new Date(startDate) > new Date(endDate)) {
                statusDiv.innerHTML = '<p class="error">Start date cannot be later than end date.</p>';
                return;
            }

            // Construct URL with date parameters
            const csvUrl = ` http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=${startDate}&f=production`;
            statusDiv.textContent = 'Fetching CSV...';

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const csvText = await response.text();
                parseCSV(csvText);
                statusDiv.textContent = 'CSV loaded successfully!';
            } catch (error) {
                console.error('Error fetching CSV:', error);
                statusDiv.innerHTML = `<p class="error">Failed to fetch CSV: ${error.message}</p>`;
            }
        }

        function readLocalCSV() {
            const fileInput = document.getElementById('csvFile');
            const statusDiv = document.getElementById('status');
            const file = fileInput.files[0];

            if (!file) {
                statusDiv.innerHTML = '<p class="error">Please select a CSV file.</p>';
                return;
            }

            statusDiv.textContent = 'Reading CSV...';
            Papa.parse(file, {
                header: true,
                complete: function(results) {
                    displayData(results.data);
                    statusDiv.textContent = 'CSV loaded successfully!';
                },
                error: function(error) {
                    console.error('Error parsing CSV:', error);
                    statusDiv.innerHTML = `<p class="error">Failed to parse CSV: ${error.message}</p>`;
                }
            });
        }

        function parseCSV(csvText) {
            Papa.parse(csvText, {
                header: true,
                complete: function(results) {
                    displayData(results.data);
                },
                error: function(error) {
                    console.error('Error parsing CSV:', error);
                    document.getElementById('status').innerHTML = `<p class="error">Failed to parse CSV: ${error.message}</p>`;
                }
            });
        }

        function displayData(data) {
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            
            // Clear previous content
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100">No data available</td></tr>';
                return;
            }

            // Create table headers
            const headers = Object.keys(data[0]);
            const headerRow = document.createElement('tr');
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                headerRow.appendChild(th);
            });
            tableHead.appendChild(headerRow);

            // Create table rows
            data.forEach(row => {
                const tr = document.createElement('tr');
                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.textContent = row[header] || '';
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
