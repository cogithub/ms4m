<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Datos</title>
    <style>
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 300px;
            margin: 20px;
        }
        label {
            font-weight: bold;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #output {
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="input-container">
        <label for="year">Año:</label>
        <input type="number" id="year" name="year" value="2025" min="2000" max="2099" required>

        <button onclick="fetchData()">Cargar Datos</button>
    </div>
    <div id="output"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script>
        // Función para contar registros en CSV
        const contarRegistrosCsv = csvData => {
            const lines = csvData.split('\n').filter(line => line.trim() !== '');
            return lines.length - 1;
        };

        // Función para fetch y procesar datos
        const fetchData = async () => {
            const outputElement = document.getElementById('output');
            const year = document.getElementById('year').value;

            // Validar el año
            if (!year || isNaN(year) || year < 2000 || year > 2099) {
                outputElement.innerHTML = '<p style="color:red">❌ Error: Ingrese un año válido (2000-2099).</p>';
                return;
            }

            outputElement.textContent = '⏳ Cargando...';

            try {
                const url = `http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=${year}/&f=statushistory`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const buffer = await response.arrayBuffer();
                const decompressed = pako.inflate(new Uint8Array(buffer), { to: 'string' });

                // Contar registros
                const numRegistros = contarRegistrosCsv(decompressed);
                console.log(`Número de registros: ${numRegistros}`);

                // Mostrar resultado
                outputElement.textContent = `✅ Datos cargados. Registros procesados: ${numRegistros}`;
            } catch (e) {
                outputElement.innerHTML = `<p style="color:red">⚠️ Error: ${e.message}</p>`;
            }
        };
    </script>
</body>
</html>
