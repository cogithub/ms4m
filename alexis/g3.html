<!DOCTYPE html>
<html lang="es" ng-app="myApp">

<head>
    <meta charset="UTF-8">
    <title>Descompresor de Archivos Gzip en Tabla</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .filter-container {
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>
<body ng-controller="myCtrl">
    <h1>Contenido del archivo Gzip en Tabla</h1>
    <div class="filter-container">
        <label for="year">Año:</label>
        <select id="year">
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <!-- Agrega más años según sea necesario -->
        </select>
        <label for="month">Mes:</label>
        <select id="month">
            <option value="01">Enero</option>
            <option value="02">Febrero</option>
            <option value="03">Marzo</option>
            <option value="04">Abril</option>
            <option value="05">Mayo</option>
            <option value="06">Junio</option>
            <option value="07">Julio</option>
            <option value="08">Agosto</option>
            <option value="09">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
        </select>
        <button onclick="fetchAndDecompress()">Obtener y Descomprimir</button>
    </div>
    <div id="output"></div>


<script>

    var duracion1 = 0;
    var duracion2 = 0;
    var duracion3 = 0;
    var duracion4 = 0;
    var duracion5 = 0;


  </script>
    
 
<table border="1">
    <thead>
        <tr>
            <th>ID Main</th>
            <th>Status main</th>
            <th>Transcurrido Hr.</th>
        </tr>
    </thead>
    <tbody>

        <tr>
            <td>1</td>
            <td>READY</td>
            <td id="duracion1"></td>
        </tr>
        <tr>
            <td>2</td>
            <td>DELAY</td>
            <td id="duracion2"></td>
        </tr>
        <tr>
            <td>3</td>
            <td>STANDBY</td>
            <td id="duracion3"></td>
        </tr>
        <tr>
            <td>4</td>
            <td>MAINT</td>
            <td id="duracion4"></td>
        </tr>
        <tr>
            <td>5</td>
            <td>OUTOFPLAN</td>
            <td id="duracion5"></td>
        </tr>
    </tbody>
</table>



    <script>


        async function fetchAndDecompress() {
            const outputElement = document.getElementById('output');
            const year = document.getElementById('year').value;
            const month = document.getElementById('month').value;
            outputElement.innerHTML = '<p>Cargando...</p>';

            try {
                // Construir la URL con los valores de año y mes seleccionados
                const response = await fetch(`http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=${year}/${month}&f=statushistory`);
                
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                // Obtener el archivo como ArrayBuffer
                const arrayBuffer = await response.arrayBuffer();
                
                // Descomprimir el contenido usando pako
                const decompressed = pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });
                
                // Dividir el contenido en líneas
                const lines = decompressed.split('\n').filter(line => line.trim() !== '');
                
                // Crear la tabla
                let tableContent = '<table>';
                
                if (lines.length > 0) {
                    // Usar la primera línea como encabezados
                    // const headers = lines[0].split(';').map(header => escapeHTML(header.trim()));
                    // tableContent += '<tr>';
                    // headers.forEach(header => {
                    //     tableContent += `<th>${header}</th>`;
                    // });
                    tableContent += '</tr>';

                    // Procesar las filas de datos (omitir la primera línea si es encabezado)
                    for (let i = 1; i < lines.length; i++) {
                        const columns = lines[i].split(';').map(col => escapeHTML(col.trim()));
                        // alert("columns->" + columns[2] + "->" + columns[10]);

                        // Procesar filas de datos que coincidan con los filtros
                        if (columns[2] == 1) {
                            duracion1 += parseFloat(columns[10]) || 0;
                            document.getElementById("duracion1").textContent = duracion1.toFixed(2);;
                            console.log("se suma1: " + columns[2] + "->" + duracion1);
                            // alert("duracion1: -" + duracion1.toFixed(2));
                        }
                        // Descomentar y ajustar según sea necesario
                        
                        if (columns[2] == 2) {
                            {{duracion2 += parseFloat(columns[10]) || 0}};
                            document.getElementById("duracion2").textContent = duracion2.toFixed(2);;
                            console.log("se suma2: " + columns[2] + "->" + duracion2);
                            // alert("duracion2: -" + duracion2.toFixed(2));
                        }
                        if (columns[2] == 3) {
                            duracion3 += parseFloat(columns[10]) || 0;
                            document.getElementById("duracion3").textContent = duracion3.toFixed(2);;
                            console.log("se suma3: " + columns[2] + "->" + duracion3);
                            // alert("duracion3: -" + duracion3.toFixed(2));
                        }
                        if (columns[2] == 4) {
                            duracion4 += parseFloat(columns[10]) || 0;
                            document.getElementById("duracion4").textContent = duracion4.toFixed(2);;

                            console.log("se suma4: " + columns[2] + "->" + duracion4);
                            // alert("duracion4: -" + duracion4.toFixed(2));
                        }
                        if (columns[2] == 5) {
                            duracion5 += parseFloat(columns[10]) || 0;
                            document.getElementById("duracion5").textContent = duracion5.toFixed(2);;

                            console.log("se suma5: " + columns[2] + "->" + duracion5);
                            // alert("duracion5: -" + duracion5.toFixed(2));
                        }
                        
                        
                        // tableContent += '<tr>';
                        // columns.forEach(col => {
                        //     tableContent += `<td>${col}</td>`;
                        // });
                        // tableContent += '</tr>';
                    }

                } 
                
                else {
                    tableContent += '<tr><td>No hay datos para mostrar</td></tr>';
                }
                
                tableContent += '</table>';
                
                // Mostrar la tabla en el elemento de salida
                outputElement.innerHTML = tableContent

            } catch (error) {
                outputElement.innerHTML = `<p>Error: ${escapeHTML(error.message)}</p>`;
            }
        }

        // Función para escapar caracteres HTML y evitar XSS
        function escapeHTML(str) {
            return str.replace(/[&<>"']/g, match => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[match]));
        }
    </script>

</body>
</html>
