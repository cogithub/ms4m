<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Archivo ZIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-4">Descargar Archivo ZIP</h1>
        <p class="text-gray-600 mb-4">Selecciona el mes y año para descargar el archivo ZIP.</p>
        <div class="mb-4">
            <label for="mes" class="mr-2">Mes:</label>
            <select id="mes" class="border rounded p-1">
                <option value="01">Enero</option>
                <option value="02">Febrero</option>
                <option value="03">Marzo</option>
                <option value="04">Abril</option>
                <option value="05">Mayo</option>
                <option value="06" selected>Junio</option>
                <option value="07">Julio</option>
                <option value="08">Agosto</option>
                <option value="09">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
            </select>
            <label for="ano" class="ml-4 mr-2">Año:</label>
            <select id="ano" class="border rounded p-1">
                <option value="2023">2023</option>
                <option value="2024">2024</option>
                <option value="2025" selected>2025</option>
            </select>
        </div>
        <button id="botonDescargar" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Descargar ZIP
        </button>
        <p id="mensaje" class="text-red-500 mt-4 hidden">Error al descargar el archivo.</p>
    </div>
    <script>
        async function descargarZipEnVentanaNueva() {
            const mes = document.getElementById("mes").value;
            const ano = document.getElementById("ano").value;
            const url = `http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=${ano}/${mes}&f=production`;
            
            const headers = {
                // "Authorization": "Bearer tu_token_aqui" // Ajusta según el servicio
            };
            const params = new URLSearchParams({ file_id: "12345" }); // Ajusta parámetros si es necesario

            try {
                // Mostrar mensaje de carga
                const mensaje = document.getElementById("mensaje");
                mensaje.classList.add("hidden");

                // Realizar la solicitud al servicio
                const response = await fetch(`${url}`, {
                    method: "GET",
                    headers: headers
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.status}`);
                }

                // Convertir la respuesta en un blob
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                // Abrir una nueva ventana o pestaña
                const nuevaVentana = window.open("", "_blank");

                if (nuevaVentana) {
                    // Crear un enlace para la descarga
                    const enlace = document.createElement("a");
                    enlace.href = blobUrl;
                    enlace.download = `file_${ano}_${mes}.mss.gz`;
                    nuevaVentana.document.body.appendChild(enlace);
                    enlace.click();

                    // Mostrar mensaje en la nueva ventana
                    nuevaVentana.document.write(`
                        <div style="font-family: Arial, sans-serif; text-align: center; padding: 20px;">
                            <h3>Descarga iniciada</h3>
                            <p>Puedes cerrar esta ventana.</p>
                        </div>
                    `);

                    // Liberar el objeto URL
                    window.URL.revokeObjectURL(blobUrl);

                    // Cerrar la ventana después de 3 segundos
                    setTimeout(() => {
                        nuevaVentana.close();
                    }, 3000);
                } else {
                    // Fallback si la ventana emergente es bloqueada
                    console.error("No se pudo abrir la ventana. ¿Bloqueo de ventanas emergentes?");
                    const enlace = document.createElement("a");
                    enlace.href = blobUrl;
                    enlace.download = `archivo_descargado_${ano}_${mes}.zip`;
                    document.body.appendChild(enlace);
                    enlace.click();
                    document.body.removeChild(enlace);
                    window.URL.revokeObjectURL(blobUrl);
                }
            } catch (error) {
                console.error("Error al descargar el archivo ZIP:", error);
                const mensaje = document.getElementById("mensaje");
                mensaje.textContent = "Error al descargar el archivo: " + error.message;
                mensaje.classList.remove("hidden");
            }
        }

        // Vincular el botón
        document.getElementById("botonDescargar").addEventListener("click", descargarZipEnVentanaNueva);
    </script>
</body>
</html>
