  <script>


// condigo de ejemplo

async function consumirApiGzip(url) {
  try {
    // Hacer la solicitud a la API
    const response = await fetch(url, {
      headers: {
        'Accept-Encoding': 'gzip', // Indica que aceptamos gzip
      },
    });

    if (!response.ok) {
      throw new Error(`Error HTTP: ${response.status}`);
    }

    // Obtener los datos como ArrayBuffer
    const compressedData = await response.arrayBuffer();
    const uint8Array = new Uint8Array(compressedData);

    // Descomprimir con Pako
    const decompressedData = pako.ungzip(uint8Array);

    // Convertir a texto si es necesario (por ejemplo, si el contenido es JSON o texto)
    const textoDescomprimido = new TextDecoder().decode(decompressedData);

    // Guardar en una constante
    const resultado = textoDescomprimido; // O usa `decompressedData` si quieres los datos binarios
    console.log('Datos descomprimidos:', resultado);

    return resultado;
  } catch (err) {
    console.error('Error al consumir o descomprimir:', err);
    throw err;
  }
}

function buscarPropiedad(arr, propiedadBusqueda, valorBusqueda, propiedadRetorno) {
  // Buscar el objeto que tenga el valor buscado en la propiedad indicada
  const objEncontrado = arr.find(obj => obj[propiedadBusqueda] === valorBusqueda);
  
  if (objEncontrado) {
    return objEncontrado[propiedadRetorno];
  } else {
    return `No se encontró ningún objeto con ${propiedadBusqueda} = ${valorBusqueda}`;
  }
}


    let duraciones = [0, 0, 0, 0, 0];
    const labels = ['READY', 'DELAY', 'STANDBY', 'MAINT', 'OUTOFPLAN'];

    // --- Función promedio ---
    const calcularPromedio = (data) =>
      data.reduce((a, b) => a + b, 0) / (data.length || 1);

    // --- Función para calcular la línea de tendencia (regresión lineal) ---
    function calcularTrendLine(data) {
      const n = data.length;
      let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
      for (let i = 0; i < n; i++) {
        sumX += i;
        sumY += data[i];
        sumXY += i * data[i];
        sumXX += i * i;
      }
      const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
      const intercept = (sumY - slope * sumX) / n;
      return data.map((_, i) => slope * i + intercept);
    }

    // --- Configuración de gráficos ---
    const ctx = document.getElementById('statusChart').getContext('2d');
    const statusChart = new Chart(ctx, {

          datalabels: {

            color: '#000'
          }
        }
      },
      plugins: [ChartDataLabels]
    });

    const areaCtx = document.getElementById('areaStatusChart').getContext('2d');
    const areaStatusChart = new Chart(areaCtx, {
      type: 'line',
      data: {
        labels: labels,

          borderColor: 'rgba(75,192,192,1)',
          borderWidth: 2,

        }, {

          borderColor: 'rgba(255,99,132,1)',
          borderWidth: 2,
          borderDash: [6, 6],
          pointRadius: 0,

        }, {
          label: 'Línea de Tendencia',
          data: Array(duraciones.length).fill(0),
          borderColor: 'rgba(0,0,255,1)',
          borderWidth: 2,
          borderDash: [4, 4],
          pointRadius: 0,
          fill: false,
          tension: 0
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Horas Transcurridas' } },

        plugins: {

          title: { display: true, text: 'Horas Transcurridas por Estado (con Promedio y Tendencia)' },

            color: '#000'
          }

      plugins: [ChartDataLabels]

    const pieCtx = document.getElementById('pieStatusChart').getContext('2d');
    const pieStatusChart = new Chart(pieCtx, {
      type: 'doughnut',
      data: {

        datasets: [{
          label: 'Horas Transcurridas',

      options: {
        responsive: true,
        cutout: '60%',

          title: { display: true, text: 'Distribución de Horas por Estado (Dona 3D)' },
          datalabels: {

            font: { weight: 'bold', size: 12 },
            color: '#000'

          animateScale: true

      },

    const highestCtx = document.getElementById('highestAreaChart').getContext('2d');
    const highestAreaChart = new Chart(highestCtx, {
      type: 'line',

        datasets: [{
          label: 'Horas Transcurridas',
          data: [],
          backgroundColor: 'rgba(255, 159, 64, 0.2)',
          borderColor: 'rgba(255, 159, 64, 1)',
          borderWidth: 2,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Horas Transcurridas' } },
          x: { title: { display: true, text: 'Estado' } }
        },
        plugins: {
          legend: { display: true },
          title: { display: true, text: 'Estado con Mayor Horas Transcurridas' },
          datalabels: {
            anchor: 'end',
            align: 'top',
            formatter: (v) => v.toFixed(2) + " hrs",
            font: { weight: 'bold', size: 12 },
            color: '#000'

    // --- Fetch y actualización de datos ---
    async function fetchAndDecompress() {
      const outputElement = document.getElementById('output');
      const highestStatusElement = document.getElementById('highestStatus');
      const fromDate = moment(document.getElementById('fromDate').value).startOf('day');
      const toDate = moment(document.getElementById('toDate').value).startOf('day');

      if (toDate.isBefore(fromDate)) {
        outputElement.innerHTML = '<p style="color:red">❌ Error: La fecha "Hasta" debe ser mayor o igual a la fecha "Desde".</p>';
        return;
      }

      let duraciones = [0, 0, 0, 0, 0];
      document.querySelectorAll("td[id^='duracion']").forEach(td => td.textContent = "0.00");
      outputElement.textContent = "⏳ Cargando...";
      highestStatusElement.textContent = "";


      try {
        let a = `${fromDate.year()}`; // Usar el año exacto de fromDate
        const url = `http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=${a}/&f=statushistory`;
        debugger
        consumirApiGzip(url).then(data => {
          // Usar la constante `data` aquí
          console.log('Contenido en constante:', data);
        });

        
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const buffer = await response.arrayBuffer();
        const decompressed = pako.inflate(new Uint8Array(buffer), { to: 'string' });
        
         const datosDescomprimidos = decompressed;

        // combinarCSVs(
        //   'archivo_a.csv',           // Ruta del primer archivo CSV
        //   'archivo_b.csv',           // Ruta del segundo archivo CSV
        //   'resultado.csv',           // Ruta del archivo de salida
        //   'Id equipment',            // Nombre de la columna clave en el primer CSV
        //   'Id equipment',            // Nombre de la columna clave en el segundo CSV
        //   'Equipment - ID')

        const lines = datosDescomprimidos.split('\n').filter(line => line.trim() !== '');

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(';').map(c => c.trim());
          const fechaRegistro = moment(cols[9], 'YYYY-MM-DD'); // Ajusta el formato según cols[9]
          //console.log('Fecha cruda:', cols[9], 'Fecha parseada:', fechaRegistro.format('YYYY-MM-DD')); // Depuración
          if ( fechaRegistro.isValid() && fechaRegistro.isSameOrAfter(fromDate) && fechaRegistro.isSameOrBefore(toDate)) {

         if ( cols[2]==1){console.log("*** ", cols[4])}// --- IGNORE ---)

            const idx = parseInt(cols[2], 10) - 1;
            if (idx >= 0 && idx < duraciones.length) {
              duraciones[idx] += parseFloat(cols[10]) || 0;
              document.getElementById(`duracion${idx + 1}`).textContent = duraciones[idx].toFixed(2);
            }
          }
        }


        // Find the status with the highest hours
        const maxHours = Math.max(...duraciones);
        const maxIndex = duraciones.indexOf(maxHours);
        const maxStatus = labels[maxIndex];

        // Calculate trend line data
        const trendLineData = calcularTrendLine(duraciones);

        // Update existing charts
        const promedio = calcularPromedio(duraciones);
        statusChart.data.datasets[0].data = duraciones;
        areaStatusChart.data.datasets[0].data = duraciones;
        areaStatusChart.data.datasets[1].data = Array(duraciones.length).fill(promedio);
        areaStatusChart.data.datasets[2].data = trendLineData;
        pieStatusChart.data.datasets[0].data = duraciones;

        // Update new chart with highest status
        highestAreaChart.data.labels = [maxStatus];
        highestAreaChart.data.datasets[0].data = [maxHours];
        highestAreaChart.data.datasets[0].label = `Horas Transcurridas (${maxStatus})`;

        statusChart.update();
        areaStatusChart.update();
        pieStatusChart.update();
        highestAreaChart.update();

        outputElement.textContent = `✅ Datos cargados. Promedio: ${promedio.toFixed(2)} hrs`;
        highestStatusElement.textContent = `Estado con mayor horas: ${maxStatus} (${maxHours.toFixed(2)} hrs)`;

      } catch (e) {
        outputElement.innerHTML = `<p style="color:red">⚠️ Error: ${e.message}</p>`;
        highestStatusElement.textContent = "";
      }
    }

    
  </script>
