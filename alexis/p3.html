<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de Estado y Duración Calculada (Segundos)</title>
<style>
body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background: #f0f2f5; color: #333; }
h2 { text-align: center; color: #1a73e8; margin-top: 30px; }
.container { width: 95%; margin: 20px auto; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow-x: auto; padding: 20px; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; }
th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: center; font-size: 14px; }
th { background: #1a73e8; color: white; font-weight: 600; cursor: pointer; white-space: nowrap; }
tr:nth-child(even) { background: #f8f9fa; }
.controls { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; gap: 10px; flex-wrap: wrap; }
.controls input { max-width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
.controls button { padding: 8px 12px; border: none; background: #1a73e8; color: white; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
.controls button:hover:not(:disabled) { background: #1557b0; }
.export-btn { background: #28a745; }
.pagination button { margin: 2px; padding: 5px 10px; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
#loadingMessage { text-align: center; font-weight: bold; font-size: 1.2em; color: #1a73e8; padding: 15px; margin-bottom: 15px; display: none; border-radius: 6px; background: #e3f2fd; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>

<h2>StatusHistory + Equipment + StatusDetail</h2>
<div id="loadingMessage">Espere, cargando y procesando datos...</div>

<div class="container">
  <div class="controls">
    <input type="text" id="globalSearch" placeholder="Buscar en todas las columnas..." aria-label="Buscar en la tabla">
    <div>
      <button onclick="limpiarFiltros()">Limpiar Filtros</button>
      <button class="export-btn" onclick="exportToCSV()">Exportar a CSV</button>
    </div>
  </div>

  <table id="combinedTable" role="grid">
    <thead>
      <tr id="header-row"></tr>
      <tr id="filter-row"></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Resumen de Duración por Id Status Main</h2>
  <table id="summaryTable">
    <thead>
      <tr>
        <th>Id status main</th>
        <th>Duración Total (Horas Decimales)</th>
        <th>Duración Total (Segundos)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="pagination" class="pagination"></div>
</div>

<script>
// URL de las APIs
const statusUrl="http://10.1.64.119:6060/api/v1/cube/get/zipfact/?d=2025&f=statushistory";
const equipmentUrl="http://10.1.64.119:6060/api/v1/cube/get/dimension/?f=equipment";
const detailUrl="http://10.1.64.119:6060/api/v1/cube/get/dimension/?f=statusdetail";

// Estado Global
let headers=[], dataRows=[], currentPage=1, rowsPerPage=20;
let idxStatusMainSummary=-1, idxDuracionHoursSummary=-1, idxDuracionSecondsSummary=-1;
let columnFilters = [];

// --- Funciones de Cálculo de Duración ---

/**
 * Convierte duración timestamp "inicio - fin" a horas decimales (Alta precisión).
 * @param {string} durationStr - Duración en formato "YYYY-MM-DD HH:MM:SS.sss - YYYY-MM-DD HH:MM:SS.sss".
 * @returns {number} Horas totales con decimales.
 */
function parseDurationToHours(durationStr){
    if(!durationStr) return 0;
    const parts = durationStr.split(" - ");
    if(parts.length !== 2) return 0;
    const start = new Date(parts[0]);
    const end = new Date(parts[1]);
    if(isNaN(start) || isNaN(end) || end <= start) return 0;
    const diffMs = end - start; 
    return diffMs / (1000 * 3600); // Milisegundos a horas
}

/**
 * Convierte duración timestamp "inicio - fin" a HH:MM:SS.
 * @param {string} durationStr - Duración en formato "YYYY-MM-DD HH:MM:SS.sss - YYYY-MM-DD HH:MM:SS.sss".
 * @returns {string} Duración en formato "HH:MM:SS".
 */
function parseDurationToHHMMSS(durationStr){
    if(!durationStr) return "00:00:00";
    const parts = durationStr.split(" - ");
    if(parts.length !== 2) return "00:00:00";
    const start = new Date(parts[0]);
    const end = new Date(parts[1]);
    if(isNaN(start) || isNaN(end) || end <= start) return "00:00:00";
    let diffSec = Math.floor((end - start)/1000);
    const hours = String(Math.floor(diffSec/3600)).padStart(2,'0');
    diffSec %= 3600;
    const minutes = String(Math.floor(diffSec/60)).padStart(2,'0');
    const seconds = String(diffSec%60).padStart(2,'0');
    return `${hours}:${minutes}:${seconds}`;
}

/**
 * Convierte una duración en formato HH:MM:SS a segundos totales.
 * @param {string} hhmmss - Duración en formato "HH:MM:SS".
 * @returns {number} Segundos totales (entero).
 */
function durationToSeconds(hhmmss) {
    if (!hhmmss) return 0;
    
    // Asume que hhmmss es un string "HH:MM:SS"
    const parts = hhmmss.split(':').map(p => parseInt(p, 10));

    if (parts.length !== 3) return 0;

    const hours = parts[0] || 0;
    const minutes = parts[1] || 0;
    const seconds = parts[2] || 0;

    return (hours * 3600) + (minutes * 60) + seconds;
}


function escapeHTML(str){ return String(str).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

async function cargarDatos(){
  const loading=document.getElementById("loadingMessage");
  loading.style.display="block";
  try {
    // 1. Cargar Dimensiones
    const [respEq, respDet, respSt] = await Promise.all([
      fetch(equipmentUrl).then(r => r.text()),
      fetch(detailUrl).then(r => r.text()),
      fetch(statusUrl).then(r => r.arrayBuffer())
    ]);

    // Procesar Equipment
    const eqRows=respEq.trim().split("\n").map(r=>r.split(";"));
    const equipmentMap={}; 
    eqRows.slice(1).forEach(r=>{ equipmentMap[r[0]]=r[1]||"Desconocido"; });

    // Procesar StatusDetail
    const detRows=respDet.trim().split("\n").map(r=>r.split(";"));
    const detHeaders=detRows[0];
    const detailMap={}; 
    detRows.slice(1).forEach(r=>{ detailMap[r[0]]=r.slice(1); });

    // Procesar StatusHistory (descomprimir pako)
    const decompressed = pako.inflate(new Uint8Array(respSt));
    const stCsv = new TextDecoder("utf-8").decode(decompressed);
    const stRows=stCsv.trim().split("\n").map(r=>r.split(";"));

    const stHeaders=stRows[0];
    let stData=stRows.slice(1);

    // Índices de columnas clave
    const idxStatusMain=stHeaders.indexOf("Id status main");
    const idxEquipment=stHeaders.indexOf("Id equipment");
    const idxDuracionOriginal=stHeaders.indexOf("Duracion"); 

    // 2. Definir Nuevas Cabeceras
    const newHeaders=[...stHeaders];
    newHeaders.splice(idxEquipment+1,0,"equipment"); 
    newHeaders.splice(idxDuracionOriginal+1,0,"Duración Decimal"); 
    newHeaders.splice(idxDuracionOriginal+2,0,"Duración HH:MM:SS");
    newHeaders.splice(idxDuracionOriginal+3,0,"Duración en Segundos"); // ¡Nueva Columna!
    newHeaders.push(...detHeaders.slice(1)); 

    // 3. Procesar Filas de Datos
    stData=stData.map(r=>{
      const idEquip=r[idxEquipment];
      const idStatus=r[idxStatusMain];
      const duracionStr=r[idxDuracionOriginal];

      const equipName=equipmentMap[idEquip]||"Desconocido";
      const statusDetails=detailMap[idStatus]||detHeaders.slice(1).map(()=> "Desconocido");
      
      const durHours=parseDurationToHours(duracionStr);
      const durHHMMSS=parseDurationToHHMMSS(duracionStr);
      const durSeconds=durationToSeconds(durHHMMSS); // Calcular segundos

      const newRow=[...r];
      newRow.splice(idxEquipment+1,0,equipName);
      newRow.splice(idxDuracionOriginal+1,0,durHours.toFixed(6)); 
      newRow.splice(idxDuracionOriginal+2,0,durHHMMSS);
      newRow.splice(idxDuracionOriginal+3,0,durSeconds); // Insertar segundos
      newRow.push(...statusDetails);
      return newRow;
    });

    headers=newHeaders.slice(1); 
    dataRows=stData.map(r=>r.slice(1));
    
    // Asignar índices para el resumen
    idxStatusMainSummary=headers.indexOf("Id status main");
    idxDuracionHoursSummary=headers.indexOf("Duración Decimal"); 
    idxDuracionSecondsSummary=headers.indexOf("Duración en Segundos"); 

    construirCabecera();
    renderTable();
    renderPagination();
    renderSummary();
  } catch(err){
    console.error("Error al cargar o procesar datos:", err);
    loading.textContent = "Error al cargar datos. Verifique las URLs y la consola.";
    loading.style.background = "#ffdddd";
  } finally{ loading.style.display="none"; }
}

// --- Funciones de Renderizado, Filtros y Paginación ---

function construirCabecera(){
  const headerRow=document.getElementById("header-row");
  const filterRow=document.getElementById("filter-row");
  headerRow.innerHTML=""; filterRow.innerHTML="";
  columnFilters = []; 

  headers.forEach((h,i)=>{
    const th=document.createElement("th"); th.textContent=escapeHTML(h); headerRow.appendChild(th);
    
    const thF=document.createElement("th");
    const sel=document.createElement("select");
    sel.innerHTML="<option value=''>Todos</option>";
    sel.addEventListener("change",(e)=>{ 
        columnFilters[i] = e.target.value;
        currentPage=1; 
        renderTable(); 
        renderPagination(); 
        renderSummary(); 
    });
    thF.appendChild(sel); filterRow.appendChild(thF);
  });
  
  headers.forEach((h,i)=>{
    const sel=filterRow.children[i].querySelector("select");
    const vals=[...new Set(dataRows.map(r=>r[i]))].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
    vals.forEach(v=>{ 
        if (v !== null && v !== undefined && String(v).trim() !== "") {
            const opt=document.createElement("option"); 
            opt.value=v; 
            opt.textContent=v; 
            sel.appendChild(opt); 
        }
    });
  });
}

function getFilteredData(){
  const searchInput=document.getElementById("globalSearch").value.toLowerCase();
  
  return dataRows.filter(r=>{
    const matchFilters=columnFilters.every((filterValue,i)=>!filterValue||filterValue===""||r[i]===filterValue);
    const matchSearch=!searchInput||r.some(v=>String(v).toLowerCase().includes(searchInput));
    
    return matchFilters&&matchSearch;
  });
}

function renderTable(){
  const tbody=document.querySelector("#combinedTable tbody");
  tbody.innerHTML="";
  const filtered=getFilteredData();
  const start=(currentPage-1)*rowsPerPage;
  const end=start+rowsPerPage;
  const pageRows=filtered.slice(start,end);
  const fragment=document.createDocumentFragment();

  if(pageRows.length===0){
    const tr=document.createElement("tr");
    tr.innerHTML=`<td colspan="${headers.length}">No hay datos que coincidan con los filtros o búsqueda.</td>`;
    fragment.appendChild(tr);
  } else {
    pageRows.forEach((r)=>{
      const tr=document.createElement("tr");
      r.forEach((v, i)=>{ 
        const td=document.createElement("td"); 
        
        // Formatear Duración Decimal
        if(headers[i] === "Duración Decimal") {
             td.textContent = parseFloat(v).toFixed(6); 
        // Formatear Duración en Segundos
        } else if (headers[i] === "Duración en Segundos") {
             td.textContent = parseInt(v, 10).toLocaleString('es-CL'); // Formato de miles
        } else {
             td.textContent=escapeHTML(v); 
        }
        tr.appendChild(td); 
      });
      fragment.appendChild(tr);
    });
  }
  tbody.appendChild(fragment);
}

function renderSummary(){
  const summaryBody=document.querySelector("#summaryTable tbody");
  summaryBody.innerHTML="";
  if(idxStatusMainSummary===-1||idxDuracionHoursSummary===-1||idxDuracionSecondsSummary===-1) return;
  
  const summaryMapHours={};
  const summaryMapSeconds={};
  
  getFilteredData().forEach(r=>{
    const status=r[idxStatusMainSummary]||"Desconocido";
    const durHours=parseFloat(r[idxDuracionHoursSummary])||0; 
    const durSeconds=parseInt(r[idxDuracionSecondsSummary])||0;
    
    if(!summaryMapHours[status]) summaryMapHours[status]=0;
    summaryMapHours[status]+=durHours;

    if(!summaryMapSeconds[status]) summaryMapSeconds[status]=0;
    summaryMapSeconds[status]+=durSeconds;
  });
  
  Object.keys(summaryMapHours).sort().forEach(status=>{
    const tr=document.createElement("tr");
    const tdStatus=document.createElement("td"); tdStatus.textContent=status; tr.appendChild(tdStatus);
    
    // Suma total en horas decimales (4 decimales)
    const tdDurHours=document.createElement("td"); tdDurHours.textContent=summaryMapHours[status].toFixed(4); tr.appendChild(tdDurHours);
    
    // Suma total en segundos (entero con formato de miles)
    const tdDurSeconds=document.createElement("td"); tdDurSeconds.textContent=summaryMapSeconds[status].toLocaleString('es-CL'); tr.appendChild(tdDurSeconds);
    
    summaryBody.appendChild(tr);
  });
}

function limpiarFiltros(){
  document.querySelectorAll("#filter-row select").forEach(sel=>sel.value="");
  document.getElementById("globalSearch").value="";
  columnFilters = []; 
  currentPage=1; 
  renderTable(); 
  renderPagination(); 
  renderSummary();
}

function exportToCSV(){
  const filtered=getFilteredData();
  const csvRows=filtered.map(r=>{
    return r.map((v, i) => {
        let value = String(v);
        if (headers[i] === "Duración Decimal") {
            value = parseFloat(v).toFixed(6).replace('.', ','); 
        } else if (headers[i] === "Duración en Segundos") {
            value = parseInt(v, 10).toString(); // Asegurar exportación como número limpio
        }
        value = value.replace(/"/g, '""');
        if (value.includes(';') || value.includes('\n') || value.includes('"')) {
            value = `"${value}"`;
        }
        return value;
    }).join(";");
  });
  
  const headerRow = headers.map(h => {
    let value = h.replace(/"/g, '""');
    if (value.includes(';') || value.includes('\n') || value.includes('"')) {
        value = `"${value}"`;
    }
    return value;
  }).join(";");
  
  const csvContent=[headerRow, ...csvRows].join("\n");
  const blob=new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=`statushistory_equipment_statusdetail_segundos_${new Date().toISOString().split("T")[0]}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

function renderPagination(){
  const pagination=document.getElementById("pagination");
  pagination.innerHTML="";
  const filtered=getFilteredData();
  const totalPages=Math.ceil(filtered.length/rowsPerPage);
  const fragment=document.createDocumentFragment();

  if (totalPages <= 1) return; 

  const firstBtn=document.createElement("button"); firstBtn.textContent="Primero"; firstBtn.disabled=currentPage===1;
  firstBtn.addEventListener("click",()=>{currentPage=1; renderTable(); renderPagination();}); fragment.appendChild(firstBtn);

  const prevBtn=document.createElement("button"); prevBtn.textContent="◄ Anterior"; prevBtn.disabled=currentPage===1;
  prevBtn.addEventListener("click",()=>{if(currentPage>1){currentPage--; renderTable(); renderPagination();}}); fragment.appendChild(prevBtn);

  const pageAndTotal=document.createElement("span"); pageAndTotal.textContent=`Página ${currentPage} de ${totalPages} - Total registros: ${filtered.length}`;
  fragment.appendChild(pageAndTotal);

  const nextBtn=document.createElement("button"); nextBtn.textContent="Siguiente ►"; nextBtn.disabled=currentPage>=totalPages;
  nextBtn.addEventListener("click",()=>{if(currentPage<totalPages){currentPage++; renderTable(); renderPagination();}}); fragment.appendChild(nextBtn);

  const lastBtn=document.createElement("button"); lastBtn.textContent="Último"; lastBtn.disabled=currentPage>=totalPages;
  lastBtn.addEventListener("click",()=>{currentPage=totalPages; renderTable(); renderPagination();}); fragment.appendChild(lastBtn);

  pagination.appendChild(fragment);
}

document.getElementById("globalSearch").addEventListener("input",()=>{
  currentPage=1; 
  renderTable(); 
  renderPagination(); 
  renderSummary();
});

// Iniciar la carga de datos al cargar la página
cargarDatos();
</script>
</body>
</html>
